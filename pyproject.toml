[project]
name = "aiagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "html5lib>=1.1",
    "openai==2.44.0",
    "pyright>=1.1.411",
    "python-dotenv==1.1.0",
    "ruff>=0.16.0",
]

[project.scripts]
qb-agent = "aiagent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiagent"]

dependencies = [
    "beautifulsoup4>=4.15.0",
    "html5lib>=1.1",
    "openai==2.44.0",
    "python-dotenv==1.1.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest",
    "ruff>=0.16.0",
]
